<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Page not found · CTTN</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f4fb;
        color: #24182d;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 6vw, 4rem);
        border: 1px solid #d9cbe4;
        border-radius: 1.25rem;
        background: #fffdfd;
        box-shadow: 0 1rem 3rem rgb(72 37 84 / 10%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #77578a;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 14ch;
        margin: 0;
        color: #3b1f4c;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 0.98;
      }

      p {
        max-width: 48ch;
        margin: 1.25rem 0 0;
        color: #55435e;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1rem;
        border: 1px solid #a887b8;
        border-radius: 0.65rem;
        color: #3d2050;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { background: #f1e8f5; }
      a:focus-visible { outline: 3px solid #b37b14; outline-offset: 3px; }

      a.primary {
        border-color: #3d2050;
        background: #3d2050;
        color: #fffdfd;
      }

      .note {
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CTTN / 404</p>
      <h1>This route is outside the catalog.</h1>
      <p>The page may have moved. Return to the component preview, read the docs section, or inspect the public source.</p>
      <nav aria-label="Missing page links">
        <a class="primary" href="/">Return home</a>
        <a href="/#docs">Read docs</a>
        <a href="https://github.com/Knowledge-Forge-AI/shadcn-theme-terminal-nova">View source</a>
      </nav>
      <p class="note">For the companion documentation theme, visit <a href="https://sttn.knowledge-forge.ai/">Terminal Nova docs</a>.</p>
    </main>
  </body>
</html>
