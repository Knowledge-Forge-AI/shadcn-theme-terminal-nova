name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Check pinned Node and npm
        run: |
          node -e 'const t=require("./tools/toolchain.json"); if (process.versions.node!==t.node) throw new Error("node "+process.version)'
          test "$(npm --version)" = "$(node -p 'require("./tools/toolchain.json").npm')"
      - name: Fetch and verify exact TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/toolchain"; mkdir -p "$T/archives" "$T/node_modules/typescript"
          BIN="@typescript/typescript-$(node -p 'process.platform+"-"+process.arch')"
          npm pack "typescript@7.0.2" "$BIN@7.0.2" --ignore-scripts --registry https://registry.npmjs.org --json --cache "$T/cache" --pack-destination "$T/archives" > "$T/pack.json"
          node --input-type=module - "$T/pack.json" "$T/archives" <<'JS'
          import assert from "node:assert/strict";
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          import {join} from "node:path";
          const t=JSON.parse(readFileSync("tools/toolchain.json")).typescript;
          const packs=JSON.parse(readFileSync(process.argv[2]));
          const binary="@typescript/typescript-"+process.platform+"-"+process.arch;
          assert.deepEqual(packs.map(p=>p.name).sort(),["typescript",binary].sort());
          const wanted={typescript:t.integrity,...t.platformBinaries};
          for (const p of packs) {
            assert.equal(p.version,t.version);
            assert.equal(p.filename,p.name.replace(/^@/,"").replace("/","-")+"-"+t.version+".tgz");
            const actual="sha512-"+createHash("sha512").update(readFileSync(join(process.argv[3],p.filename))).digest("base64");
            assert.equal(actual,wanted[p.name],"archive integrity "+p.name);
            assert.equal(p.integrity,actual);
          }
          JS
          mkdir -p "$T/node_modules/$BIN"
          tar -xzf "$T"/archives/typescript-7.0.2.tgz --strip-components=1 -C "$T/node_modules/typescript"
          tar -xzf "$T"/archives/typescript-typescript-*-7.0.2.tgz --strip-components=1 -C "$T/node_modules/$BIN"
          echo "CTTN_TYPESCRIPT=$T/node_modules/typescript" >> "$GITHUB_ENV"
      - name: Fetch exact engine archives (hash-verified by the producer)
        shell: bash
        run: |
          E="$RUNNER_TEMP/engines"; mkdir -p "$E"
          npm pack @knowledge-forge-ai/theme-forge-solar-sail@0.3.0 @knowledge-forge-ai/theme-forge-stellar-loom@0.5.0 --ignore-scripts --registry https://registry.npmjs.org --cache "$RUNNER_TEMP/npm-cache" --pack-destination "$E"
          echo "CTTN_SOLAR_TGZ=$E/knowledge-forge-ai-theme-forge-solar-sail-0.3.0.tgz" >> "$GITHUB_ENV"
          echo "CTTN_LOOM_TGZ=$E/knowledge-forge-ai-theme-forge-stellar-loom-0.5.0.tgz" >> "$GITHUB_ENV"
      - name: Closed repository verification and byte-identical composition replay
        run: node tools/verify.mjs --repository --replay --solar "$CTTN_SOLAR_TGZ" --loom "$CTTN_LOOM_TGZ"
      - name: Regression and tamper tests
        run: node --test test/*.test.mjs
      - name: Rebuild, prepack, pack inspection, installed import/SSR/TypeScript consumer
        run: node tools/qualify-package.mjs --out "$RUNNER_TEMP/qualify" --typescript "$CTTN_TYPESCRIPT"
      - name: Fail if the working tree changed
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/qualify/qualification.json
            ${{ runner.temp }}/qualify/pack-prepack/*.tgz
          if-no-files-found: error
          retention-days: 14
